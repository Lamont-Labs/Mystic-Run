name: Knight asset rebuild evidence

on:
  workflow_dispatch:
  push:
    branches: ['art/asset-upgrade-batch-01']
    paths:
      - 'tools/build_knight_asset.py'
      - 'tools/verify_knight_glb.py'
      - '.github/workflows/knight-asset-rebuild.yml'

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install Blender 4.3.2 for isolated asset rebuild
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --output /tmp/blender.tar.xz https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz
          echo '4da1c956673c0485e63054e563ee69198cc8f80d8157dd7592dffc8a6a5592e6  /tmp/blender.tar.xz' | sha256sum --check
          sha256sum /tmp/blender.tar.xz | tee blender-archive-sha256.txt
          mkdir -p /tmp/mystic-blender
          tar -xJf /tmp/blender.tar.xz -C /tmp/mystic-blender --strip-components=1
          /tmp/mystic-blender/blender --background --factory-startup --python-expr "import bpy; assert bpy.app.version[:3] == (4,3,2), bpy.app.version_string"
      - name: Rebuild Knight GLB and provenance
        run: /tmp/mystic-blender/blender --background --factory-startup --python-exit-code 1 --python tools/build_knight_asset.py
      - name: Validate newly generated GLB
        run: python3 tools/verify_knight_glb.py | tee knight-structural-report.json
      - name: Verify source-to-output modifications are isolated
        shell: bash
        run: |
          set -euo pipefail
          git status --short | tee knight-generated-files.txt
          git diff --name-only | while read -r file; do
            case "$file" in
              assets/characters/knight/knight.glb|assets/characters/knight/PROVENANCE.json|assets/asset_registry.json) ;;
              *) echo "Unexpected tracked change: $file"; exit 1 ;;
            esac
          done
      - name: Import regenerated Knight in pinned Godot
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bootstrap_godot.py --cache "${RUNNER_TEMP}/godot" > godot-binary-path.txt
          "$(cat godot-binary-path.txt)" --headless --path . --editor --import --quit
          "$(cat godot-binary-path.txt)" --headless --path . --script res://tests/rig_motion.gd
          "$(cat godot-binary-path.txt)" --headless --path . --script res://tests/knight_expressions.gd
      - name: Capture actual Godot Knight turnaround and chase-camera frames
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libgl1 libx11-6 libxrandr2 libxi6 libxcursor1 libxinerama1
          mkdir -p knight-render-evidence/stage knight-render-evidence/chase
          python3 tools/render_preview.py --godot "$(cat godot-binary-path.txt)" --output knight-render-evidence/stage --character knight --script res://tests/preview_authored_character.gd --frames 120
          python3 tools/render_preview.py --godot "$(cat godot-binary-path.txt)" --output knight-render-evidence/chase --character knight --script res://tests/preview_character_benchmark.gd --frames 100
          test -s knight-render-evidence/stage/knight-front.png
          test -s knight-render-evidence/stage/knight-rear.png
          test -s knight-render-evidence/stage/knight-side.png
          test -s knight-render-evidence/chase/knight-benchmark-0040.png
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          base=Path('knight-render-evidence')
          entries=[]
          for file in sorted(base.rglob('*.png')):
              data=file.read_bytes()
              assert data[:8] == bytes.fromhex('89504e470d0a1a0a') and len(data)>1000, file
              entries.append({'path':file.as_posix(),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          assert len(entries)>=4, entries
          (base/'capture-manifest.json').write_text(json.dumps({'source':'Actual Godot 4.7.2 Compatibility rendering of rebuilt Knight GLB','captures':entries,'scope':'Desktop software rendering; no phone FPS or art approval'},indent=2))
          print('KNIGHT_CAPTURE_MANIFEST',len(entries))
          PY
      - name: Upload generated asset and evidence (review only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: knight-rebuild-review
          path: |
            assets/characters/knight/knight.glb
            assets/characters/knight/PROVENANCE.json
            assets/asset_registry.json
            knight-structural-report.json
            knight-generated-files.txt
            blender-archive-sha256.txt
            godot-binary-path.txt
            knight-render-evidence/
          retention-days: 14
          if-no-files-found: warn
