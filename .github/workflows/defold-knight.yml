name: Playable Defold Knight - web and unsigned compile checks
on:
  push:
    branches: ['experiment/defold-knight-playable']
    paths:
      - 'experiments/defold-knight/**'
      - 'tools/build_defold_knight.py'
      - '.github/workflows/defold-knight.yml'
permissions:
  contents: read
jobs:
  playable-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with: {distribution: temurin, java-version: '25'}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - name: Install image-processing and headless runtime dependencies on this Ubuntu runner
        run: |
          python -m pip install Pillow==13.0.0
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libopenal1
      - run: python tools/build_defold_knight.py
      - name: Retain the actual playable WebAssembly bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: defold-knight-playable-web
          path: generated-artifacts/defold-knight/web/
          retention-days: 14
      - name: Retain logs and provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: defold-knight-test-evidence
          path: |
            generated-artifacts/defold-knight/*.log
            generated-artifacts/defold-knight/evidence.json
            generated-artifacts/defold-knight/provenance.json
          retention-days: 14
