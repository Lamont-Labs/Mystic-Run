name: Compile Android APK

on:
  push:
    branches: [main, 'quality/**']
    paths:
      - '.github/workflows/android-compile.yml'
      - 'tools/**'
      - 'game/**'
      - 'core/**'
      - 'assets/**'
      - 'scenes/**'
      - 'content/**'
      - 'project.godot'
      - 'export_presets.cfg'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout game
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install pinned Godot and Android templates
        run: |
          python3 tools/bootstrap_godot.py --cache "${RUNNER_TEMP}/godot" > "${RUNNER_TEMP}/godot-path"
          python3 tools/fetch_android_template.py
      - name: Set up Android SDK command line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          log-accepted-android-sdk-licenses: false
          packages: ''
      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'build-tools;35.0.1' 'platforms;android-36'
      - name: Check gameplay core
        run: python3 tools/verify_core.py --godot "$(cat "${RUNNER_TEMP}/godot-path")"
      - name: Check Android manifest policy guards
        run: python3 -m unittest discover -s tools -p test_android_policy.py
      - name: Compile and inspect unsigned APK
        run: |
          python3 tools/build_android.py --unsigned --godot "$(cat "${RUNNER_TEMP}/godot-path")" --sdk "${ANDROID_SDK_ROOT}" --version-code "$((1000 + GITHUB_RUN_NUMBER))" --version-name 0.6.1
      - name: Create installable preview APK with temporary signing identity
        run: |
          keytool -genkeypair -noprompt -keystore "${RUNNER_TEMP}/preview.keystore" -storepass android -keypass android -alias preview -keyalg RSA -keysize 3072 -validity 365 -dname "CN=MysticRun Preview, O=Lamont Labs, C=US"
          "${ANDROID_SDK_ROOT}/build-tools/35.0.1/apksigner" sign --ks "${RUNNER_TEMP}/preview.keystore" --ks-key-alias preview --ks-pass pass:android --key-pass pass:android --out build/Mystic_Run_0.6.1_MAIN_PREVIEW.apk build/Mystic_Run_0.6.1_unsigned.apk
          "${ANDROID_SDK_ROOT}/build-tools/35.0.1/apksigner" verify --verbose build/Mystic_Run_0.6.1_MAIN_PREVIEW.apk
          sha256sum build/Mystic_Run_0.6.1_MAIN_PREVIEW.apk > build/preview-sha256.txt
      - name: Preserve compilation for owner signing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mystic-run-unsigned-android
          path: |
            build/*_unsigned.apk
            build/*_MAIN_PREVIEW.apk
            build/preview-sha256.txt
            build/apk-manifest.json
            build/apk-signature.txt
            build/apk-package.txt
            build/android-export.log
            docs/verification_actual.json
          retention-days: 30
          if-no-files-found: error
      - name: Explain signing status
        run: |
          echo 'GitHub compiled this APK. The artifact includes a temporary-key signed preview APK. It cannot update the owner-signed installed app; uninstalling the old app may erase local game data. Production updates require the original owner key.' >> "$GITHUB_STEP_SUMMARY"
