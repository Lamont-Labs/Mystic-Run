name: Compile Android APK

on:
  push:
    branches: [main, 'quality/**']
    paths:
      - '.github/workflows/android-compile.yml'
      - 'tools/**'
      - 'game/**'
      - 'core/**'
      - 'assets/**'
      - 'scenes/**'
      - 'content/**'
      - 'project.godot'
      - 'export_presets.cfg'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout game
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install pinned Godot and Android templates
        run: |
          python3 tools/bootstrap_godot.py --cache "${RUNNER_TEMP}/godot" > "${RUNNER_TEMP}/godot-path"
          python3 tools/fetch_android_template.py
      - name: Set up Android SDK command line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          log-accepted-android-sdk-licenses: false
          packages: ''
      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'build-tools;35.0.1' 'platforms;android-35'
      - name: Check gameplay core
        run: python3 tools/verify_core.py --godot "$(cat "${RUNNER_TEMP}/godot-path")"
      - name: Compile and inspect unsigned APK
        run: |
          python3 tools/build_android.py --unsigned --godot "$(cat "${RUNNER_TEMP}/godot-path")" --sdk "${ANDROID_SDK_ROOT}" --version-code "$((1000 + GITHUB_RUN_NUMBER))" --version-name 0.2.0
      - name: Preserve compilation for owner signing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mystic-run-unsigned-android
          path: |
            build/*_unsigned.apk
            build/apk-manifest.json
            build/apk-signature.txt
            build/apk-package.txt
            build/android-export.log
            docs/verification_actual.json
          retention-days: 30
          if-no-files-found: error
      - name: Explain signing status
        run: |
          echo 'GitHub compiled this APK. The artifact is unsigned and requires the preserved owner key before phone installation.' >> "$GITHUB_STEP_SUMMARY"
