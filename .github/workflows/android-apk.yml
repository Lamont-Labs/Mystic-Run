name: Mystic Run Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mystic-run-permanent-android-signing
  cancel-in-progress: false

jobs:
  android:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: android-signing
    steps:
      - name: Checkout game
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Require replacement signing credentials
        env:
          MYSTICRUN_KEYSTORE_BASE64: ${{ secrets.MYSTICRUN_KEYSTORE_BASE64 }}
          MYSTICRUN_STORE_PASSWORD: ${{ secrets.MYSTICRUN_STORE_PASSWORD }}
          MYSTICRUN_KEY_PASSWORD: ${{ secrets.MYSTICRUN_KEY_PASSWORD }}
        run: |
          umask 077
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          required = ('MYSTICRUN_KEYSTORE_BASE64', 'MYSTICRUN_STORE_PASSWORD', 'MYSTICRUN_KEY_PASSWORD')
          if any(not os.environ.get(name) for name in required):
              raise SystemExit('Configure all replacement signing secrets in the protected android-signing environment. Never generate a key.')
          target = Path(os.environ['RUNNER_TEMP'])/'mysticrun.keystore'
          with target.open('xb') as stream:
              stream.write(base64.b64decode(os.environ['MYSTICRUN_KEYSTORE_BASE64'], validate=True))
          PY
      - name: Verify replacement public certificate
        env:
          MYSTICRUN_STORE_PASSWORD: ${{ secrets.MYSTICRUN_STORE_PASSWORD }}
        run: |
          keytool -exportcert -alias mysticrun -keystore "${RUNNER_TEMP}/mysticrun.keystore" -storepass:env MYSTICRUN_STORE_PASSWORD > "${RUNNER_TEMP}/signing-cert.der"
          echo '8ccd240d320a0ac8568581d5c7e005538033681d8b882058d673c80719dfd859  '"${RUNNER_TEMP}/signing-cert.der" | sha256sum -c -
      - name: Install pinned editor and Android templates
        run: |
          python3 tools/bootstrap_godot.py --cache "${RUNNER_TEMP}/godot" > "${RUNNER_TEMP}/godot-path"
          python3 tools/fetch_android_template.py
      - name: Set up Android SDK command line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          log-accepted-android-sdk-licenses: false
          packages: ''
      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'build-tools;35.0.1' 'platforms;android-36'
      - name: Run gameplay core checks
        run: python3 tools/verify_core.py --godot "$(cat "${RUNNER_TEMP}/godot-path")"
      - name: Check Android release contracts
        run: |
          python3 -m unittest discover -s tools -p 'test_android*.py'
          python3 -m unittest discover -s .github/scripts -p 'test_release_reconstruction.py'
      - name: Compile unsigned APK
        run: |
          python3 tools/build_android.py --unsigned --godot "$(cat "${RUNNER_TEMP}/godot-path")" --sdk "${ANDROID_SDK_ROOT}" --version-code "$((2000 + GITHUB_RUN_NUMBER))" --version-name 0.6.2
      - name: Sign and verify replacement-key APK
        env:
          MYSTICRUN_STORE_PASSWORD: ${{ secrets.MYSTICRUN_STORE_PASSWORD }}
          MYSTICRUN_KEY_PASSWORD: ${{ secrets.MYSTICRUN_KEY_PASSWORD }}
        run: |
          python3 tools/sign_android.py --apk build/Mystic_Run_0.6.2_unsigned.apk --manifest build/apk-manifest.json --sdk "${ANDROID_SDK_ROOT}" --keystore "${RUNNER_TEMP}/mysticrun.keystore" --expected-commit "${GITHUB_SHA}" --expected-run-id "${GITHUB_RUN_ID}" --output "${RUNNER_TEMP}/verified-apk/Mystic_Run_0.6.2_Build$((2000 + GITHUB_RUN_NUMBER)).apk"
      - name: Preserve unsigned input for verified release reconstruction
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mystic-run-unsigned-android
          path: |
            build/Mystic_Run_0.6.2_unsigned.apk
            build/apk-manifest.json
          retention-days: 30
          if-no-files-found: error
      - name: Preserve verified APK and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mystic-run-android-apk
          path: ${{ runner.temp }}/verified-apk/*
          retention-days: 30
          if-no-files-found: error
      - name: Explain installation compatibility
        run: |
          echo 'Verified replacement-key APK only; no GitHub Release was published. Updates require the same replacement certificate and a higher version code. This cannot update legacy-key installations. Do not uninstall or modify the existing phone game.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove runner signing material
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/mysticrun.keystore" "${RUNNER_TEMP}/signing-cert.der"
          rm -f "${HOME}/.config/godot/editor_settings-4.7.tres"
