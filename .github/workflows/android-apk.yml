name: Mystic Run Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mystic-run-permanent-android-release
  cancel-in-progress: false

jobs:
  android:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout game
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Require owner signing identity
        env:
          RELAY_KEYSTORE_BASE64: ${{ secrets.RELAY_DEVELOPMENT_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os,base64
          from pathlib import Path
          encoded=os.environ.get('RELAY_KEYSTORE_BASE64','')
          if not encoded:
              raise SystemExit('Configure RELAY_DEVELOPMENT_KEYSTORE_BASE64 with the existing owner development key before exporting updates.')
          target=Path(os.environ['RUNNER_TEMP'])/'owner-development.keystore'
          target.write_bytes(base64.b64decode(encoded,validate=True))
          target.chmod(0o600)
          PY
      - name: Verify permanent development signing certificate
        env:
          RELAY_KEY_PASSWORD: ${{ secrets.RELAY_DEVELOPMENT_KEY_PASSWORD }}
        run: |
          test -n "$RELAY_KEY_PASSWORD" || { echo 'Permanent signing password secret missing'; exit 1; }
          keytool -exportcert -alias androiddebugkey -keystore "${RUNNER_TEMP}/owner-development.keystore" -storepass:env RELAY_KEY_PASSWORD > "${RUNNER_TEMP}/signing-cert.der"
          echo '6cae555cdc35ea335e5ca6f29252bfad9ebc1cbc9a12c83e18c7eb1038a6a8cf  '"${RUNNER_TEMP}/signing-cert.der" | sha256sum -c -
      - name: Install pinned editor and Android templates
        run: |
          python3 tools/bootstrap_godot.py --cache "${RUNNER_TEMP}/godot" > "${RUNNER_TEMP}/godot-path"
          python3 tools/fetch_android_template.py
      - name: Set up Android SDK command line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          log-accepted-android-sdk-licenses: false
          packages: ''
      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'build-tools;35.0.1' 'platforms;android-36'
      - name: Run gameplay core checks
        run: python3 tools/verify_core.py --godot "$(cat "${RUNNER_TEMP}/godot-path")"
      - name: Check Android release contracts
        run: |
          python3 -m unittest discover -s tools -p 'test_android*.py'
          python3 -m unittest discover -s .github/scripts -p test_release_reconstruction.py
      - name: Build and verify APK
        env:
          RELAY_KEY_PASSWORD: ${{ secrets.RELAY_DEVELOPMENT_KEY_PASSWORD }}
        run: |
          python3 tools/build_android.py --godot "$(cat "${RUNNER_TEMP}/godot-path")" --sdk "${ANDROID_SDK_ROOT}" --keystore "${RUNNER_TEMP}/owner-development.keystore" --version-code "$((2000 + GITHUB_RUN_NUMBER))" --version-name 0.6.2
      - name: Preserve APK and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mystic-run-android-apk
          path: |
            build/*.apk
            build/apk-manifest.json
            build/apk-signature.txt
            build/apk-package.txt
            docs/verification_actual.json
          retention-days: 30
          if-no-files-found: error
      - name: Verify and publish permanent-key APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=.github/scripts python3 - <<'PY'
          import json,os,subprocess,tempfile
          from pathlib import Path
          import publish_android_release as release
          manifest=json.loads(Path('build/apk-manifest.json').read_text())
          if manifest.get('git_commit')!=os.environ['GITHUB_SHA'] or manifest.get('builder',{}).get('commit')!=os.environ['GITHUB_SHA']:
              raise SystemExit('Release source does not match the current main build')
          if manifest.get('certificate_sha256')!=release.PERMANENT_CERTIFICATE or manifest.get('permanent_signing_identity') is not True or manifest.get('updates_legacy_owner_installation') is not False:
              raise SystemExit('Permanent signing identity or compatibility declaration mismatch')
          apk=Path('build')/manifest['apk']
          sdk=Path(os.environ['ANDROID_SDK_ROOT'])
          release.write_verification(apk,sdk,manifest)
          tag=f"v{manifest['version_name']}-build{manifest['version_code']}"
          notes=Path(os.environ['RUNNER_TEMP'])/'permanent-release-notes.md'
          notes.write_text('MysticRun Android development build from main.\n\n'+release.signing_note(manifest)+'\n\nSource commit: '+manifest['git_commit']+'\n')
          existing=subprocess.run(['gh','release','view',tag,'--repo',release.REPOSITORY],capture_output=True,text=True,timeout=60)
          if existing.returncode:
              if 'release not found' not in existing.stderr.lower():
                  raise SystemExit('Unable to inspect the release status')
              release.command(['gh','release','create',tag,'--repo',release.REPOSITORY,'--target',manifest['git_commit'],'--title',f"Mystic Run {manifest['version_name']} - permanent Android build {manifest['version_code']}",'--notes-file',notes,'--prerelease',apk,apk.with_suffix('.manifest.json'),apk.parent/'APK-SIGNATURE.txt',apk.parent/'SHA256SUMS'])
          with tempfile.TemporaryDirectory(prefix='verify-published-') as temporary:
              destination=Path(temporary)
              release.command(['gh','release','download',tag,'--repo',release.REPOSITORY,'--pattern',apk.name,'--dir',destination])
              published=destination/apk.name
              release.write_verification(published,sdk,manifest)
          print(release.command(['gh','release','view',tag,'--repo',release.REPOSITORY,'--json','url,assets']))
          PY
      - name: Remove runner signing material
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/owner-development.keystore" "${RUNNER_TEMP}/signing-cert.der"
          rm -f "${HOME}/.config/godot/editor_settings-4.7.tres"

