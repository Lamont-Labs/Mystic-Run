name: Mystic Run Android APK

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Gameplay core checks"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: mystic-run-permanent-android-signing
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      github.repository == 'Lamont-Labs/Mystic-Run' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        !contains(github.event.workflow_run.head_commit.message, '[skip android release]') &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    outputs:
      version_code: ${{ steps.release.outputs.version_code }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Require successful protected-main gameplay verification
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/android_release_automation.py preflight

  android:
    needs: gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: android-signing
    steps:
      - name: Checkout game
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install pinned editor and Android templates
        run: |
          python3 tools/bootstrap_godot.py --cache "${RUNNER_TEMP}/godot" > "${RUNNER_TEMP}/godot-path"
          python3 tools/fetch_android_template.py
      - name: Set up Android SDK command line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          log-accepted-android-sdk-licenses: false
          packages: ''
      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'build-tools;35.0.1' 'platforms;android-36'
      - name: Run gameplay core checks
        run: python3 tools/verify_core.py --godot "$(cat "${RUNNER_TEMP}/godot-path")"
      - name: Check Android release contracts
        run: |
          python3 -m unittest discover -s tools -p 'test_android*.py'
          python3 -m unittest discover -s .github/scripts -p 'test_release_reconstruction.py'
      - name: Compile unsigned APK
        run: |
          python3 tools/build_android.py --unsigned --godot "$(cat "${RUNNER_TEMP}/godot-path")" --sdk "${ANDROID_SDK_ROOT}" --version-code "${{ needs.gate.outputs.version_code }}" --version-name 0.6.2
      - name: Restore only the preserved permanent signing key
        env:
          MYSTICRUN_KEYSTORE_BASE64: ${{ secrets.MYSTICRUN_KEYSTORE_BASE64 }}
        run: |
          umask 077
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ.get('MYSTICRUN_KEYSTORE_BASE64')
          if not value:
              raise SystemExit('Permanent signing secret is missing; never generate a key')
          target = Path(os.environ['RUNNER_TEMP'])/'mysticrun.keystore'
          with target.open('xb') as stream:
              stream.write(base64.b64decode(value, validate=True))
          PY
      - name: Sign and verify replacement-key APK
        env:
          MYSTICRUN_STORE_PASSWORD: ${{ secrets.MYSTICRUN_STORE_PASSWORD }}
          MYSTICRUN_KEY_PASSWORD: ${{ secrets.MYSTICRUN_KEY_PASSWORD }}
        run: |
          python3 tools/sign_android.py --apk build/Mystic_Run_0.6.2_unsigned.apk --manifest build/apk-manifest.json --sdk "${ANDROID_SDK_ROOT}" --keystore "${RUNNER_TEMP}/mysticrun.keystore" --expected-commit "${GITHUB_SHA}" --expected-run-id "${GITHUB_RUN_ID}" --output "${RUNNER_TEMP}/verified-apk/Mystic_Run_0.6.2_Build${{ needs.gate.outputs.version_code }}.apk"
      - name: Preserve unsigned input for verified release reconstruction
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mystic-run-unsigned-android
          path: |
            build/Mystic_Run_0.6.2_unsigned.apk
            build/apk-manifest.json
          retention-days: 30
          if-no-files-found: error
      - name: Preserve verified APK and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mystic-run-android-apk
          path: ${{ runner.temp }}/verified-apk/*
          retention-days: 30
          if-no-files-found: error
      - name: Explain installation compatibility
        run: |
          echo 'Updates require the same permanent replacement certificate and a higher version code. Legacy-key installations are incompatible. No phone installation was changed. The separate publish job re-verifies the APK before automatic release.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove runner signing material
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/mysticrun.keystore" "${RUNNER_TEMP}/signing-cert.der"
          rm -f "${HOME}/.config/godot/editor_settings-4.7.tres"

  publish:
    needs: [gate, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: android-release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mystic-run-android-apk
          path: verified-apk
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'build-tools;35.0.1'
      - name: Independently verify APK and publish immutable build
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/android_release_automation.py publish --directory verified-apk --sdk "${ANDROID_SDK_ROOT}"
